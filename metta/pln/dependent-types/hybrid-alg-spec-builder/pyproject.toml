[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-alg-spec-builder"
version = "0.1.0"
description = "Hybrid evidence, embedding, schema, logic, and LLM algebraic specification builder"
requires-python = ">=3.10"
dependencies = ["openai>=2.0.0"]

[project.scripts]
hybrid-alg-spec = "hybrid_alg_spec_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
